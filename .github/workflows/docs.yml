name: Docs

on:
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "src/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install docs extra
        run: |
          uv venv
          uv pip install -e ".[docs]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          if-no-files-found: error

  # Option A in RELEASE.md. Requires Settings > Pages > Source: GitHub Actions.
  # The site lands at https://richardsonlima.github.io/aeon-core/ unless the
  # public site links to it. Skipped on pull requests.
  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
