[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aeon-core"
dynamic = ["version"]
description = "Gate the actions of LLM agents and inject controlled faults to check that they fail safe."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Richardson Lima" }]
keywords = ["llm", "agents", "safety", "guardrails", "chaos-engineering", "audit", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The core install stays dependency-free. tomli is the stdlib tomllib backport, needed on 3.10 only.
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
runtime = ["fastapi>=0.110", "uvicorn>=0.29"]
ui = ["aeon-core[runtime]"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.2"]
all = ["aeon-core[runtime,ui,openai,anthropic,langgraph]"]

[dependency-groups]
# Development tools are not part of the published package metadata.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy==2.4.1",
    "ruff==0.17.6",
    "httpx>=0.27",
    "build>=1.2",
    "twine>=5",
    "pip-audit>=2.7",
]
# Floors are the versions the strict docs build was verified with. The docs toolchain
# needs Python 3.12 here (pymdown-extensions 13 needs 3.11.5+); the docs job runs on 3.12.
docs = [
    "mkdocs>=1.6.1; python_version >= '3.12'",
    "mkdocs-material>=9.8.2; python_version >= '3.12'",
    "mkdocs-static-i18n>=1.3.1; python_version >= '3.12'",
    "mkdocstrings>=1.0.8; python_version >= '3.12'",
    "mkdocstrings-python>=2.0.11; python_version >= '3.12'",
    "pymdown-extensions>=13.1.2; python_version >= '3.12'",
]

[project.scripts]
aeon = "aeon.cli.main:main"

[project.urls]
Homepage = "https://www.richardsonlima.com.br/aeon"
Documentation = "https://www.richardsonlima.com.br/aeon/docs/"
Repository = "https://github.com/richardsonlima/aeon-core"
Issues = "https://github.com/richardsonlima/aeon-core/issues"
Changelog = "https://github.com/richardsonlima/aeon-core/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/aeon/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aeon"]

[tool.hatch.build.targets.wheel.force-include]
"controlplane" = "aeon/controlplane"
# docs served by `aeon docs mcp` and `/v1/claims` when installed from a wheel
"docs" = "aeon/_docs"

[tool.hatch.build.targets.sdist]
include = ["src", "controlplane", "tests", "examples", "campaigns", "benchmarks", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "A", "B", "C90", "D", "UP", "SIM", "RUF", "S", "PT"]
# SIM113: explicit counters read clearer in the chain verifier

# N818: ActionBlocked, ActionLimited, ToolTimeout... are public names that describe events
#       (see docs/decisions/002-python-practices.md).
# D105/D107: magic methods and __init__ are documented on the class.
ignore = ["S101", "RUF001", "RUF002", "RUF003", "SIM113", "N818", "D105", "D107"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT011", "PT018", "D", "C90"]
"benchmarks/**" = ["S", "D1"]
"scripts/**" = ["D1"]
"src/aeon/chaos/**" = ["S311"]
"examples/**" = ["S", "D1"]
# invoke(input, config) mirrors the LangChain Runnable signature
"src/aeon/adapters/langgraph.py" = ["A002", "A006"]
"examples/langgraph_agent/main.py" = ["A002"]
"tests/test_adapters.py" = ["A002"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
enable_error_code = ["truthy-bool", "ignore-without-code", "redundant-expr"]
files = ["src/aeon"]

[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "openai.*", "anthropic.*", "langgraph.*", "langchain_core.*", "tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = ["runtime: needs the runtime extra", "slow: slow test"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["aeon"]
branch = true

[tool.coverage.report]
# Floor a few points under the measured branch coverage (91% on 2026-11-27).
fail_under = 88
show_missing = true
skip_covered = true
