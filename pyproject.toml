[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aeon-core"
dynamic = ["version"]
description = "Gate the actions of LLM agents and inject controlled faults to check that they fail safe."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Richardson Lima" }]
keywords = ["llm", "agents", "safety", "guardrails", "chaos-engineering", "audit", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The core install stays dependency-free. tomli is the stdlib tomllib backport, needed on 3.10 only.
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
runtime = ["fastapi>=0.110", "uvicorn>=0.29"]
ui = ["aeon-core[runtime]"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.2"]
all = ["aeon-core[runtime,ui,openai,anthropic,langgraph]"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
    "build>=1.2",
    "twine>=5",
]
docs = ["mkdocs-material>=9.5", "mkdocs-static-i18n>=1.2", "mkdocstrings[python]>=0.26"]

[project.scripts]
aeon = "aeon.cli.main:main"

[project.urls]
Homepage = "https://www.richardsonlima.com.br/aeon"
Documentation = "https://www.richardsonlima.com.br/aeon/docs/"
Repository = "https://github.com/richardsonlima/aeon-core"
Issues = "https://github.com/richardsonlima/aeon-core/issues"
Changelog = "https://github.com/richardsonlima/aeon-core/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/aeon/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aeon"]

[tool.hatch.build.targets.wheel.force-include]
"controlplane" = "aeon/controlplane"

[tool.hatch.build.targets.sdist]
include = ["src", "controlplane", "tests", "examples", "campaigns", "benchmarks", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
# SIM113: explicit counters read clearer in the chain verifier

ignore = ["S101", "RUF001", "RUF002", "RUF003", "SIM113"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT011", "PT018"]
"benchmarks/**" = ["S"]
"src/aeon/chaos/**" = ["S311"]
"examples/**" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/aeon"]

[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "openai.*", "anthropic.*", "langgraph.*", "langchain_core.*", "tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = ["runtime: needs the runtime extra", "slow: slow test"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["aeon"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
